name: Build Auto-Hustle Standalone APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: 'zulu', java-version: '21' }
      - run: |
          npm uninstall @base44/sdk || true
          npm install
          npm install @capacitor/core @capacitor/preferences @capacitor/app
          npm install -D @capacitor/cli @capacitor/android
      - run: npx vite build
      - run: |
          npx cap add android || true
          npx cap copy android
          npx cap update android
      - run: |
          cp -r icons/* android/app/src/main/res/
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: |
          [ -f autohustle.jks ] || keytool -genkeypair -v -keystore autohustle.jks -alias autohustle -keyalg RSA -keysize 2048 -validity 10000 -storepass autohustle123 -keypass autohustle123 -dname "CN=AutoHustle, OU=Mechanic, O=AutoHustle, L=Petersburg, ST=IL, C=US"
          
          # Dynamically find the installed apksigner binary
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          $APKSIGNER sign --ks autohustle.jks --ks-pass pass:autohustle123 --key-pass pass:autohustle123 --ks-key-alias autohustle --out AutoHustle_AIMechanic.apk android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoHustle_AIMechanic_APK
          path: AutoHustle_AIMechanic.apk
