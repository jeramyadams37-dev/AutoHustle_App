name: Build Auto-Hustle Standalone APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: 'zulu', java-version: '21' }
      - run: npm install
      - run: npm run build
      - run: |
          npx cap add android || true
          npx cap copy android
          npx cap update android
      - run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          cat << 'SVGEOF' > icon.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs><radialGradient id="bgGrad" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#18181b" /><stop offset="100%" stop-color="#09090b" /></radialGradient></defs><rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="#27272a" stroke-width="6" /><path d="M256 52 L436 156 L436 356 L256 460 L76 356 L76 156 Z" fill="#121215" stroke="#3f3f46" stroke-width="12" stroke-linejoin="round" /><circle cx="256" cy="256" r="126" fill="none" stroke="#f97316" stroke-width="10" stroke-dasharray="28 14" opacity="0.9" /><g transform="translate(140, 140)"><path d="M185 35 L205 55 L85 175 C75 185 55 185 45 175 C35 165 35 145 45 135 L165 15 Z" fill="#f97316" /><path d="M55 45 L175 165 C185 175 185 195 175 205 C165 215 145 215 135 205 L15 85 Z" fill="#ea580c" opacity="0.85" /><circle cx="116" cy="116" r="18" fill="#121215" stroke="#f97316" stroke-width="6" /></g></svg>
          SVGEOF
          RES_DIR="android/app/src/main/res"
          declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
          for DIR in "${!SIZES[@]}"; do
            mkdir -p "$RES_DIR/$DIR"
            convert -background none icon.svg -resize "${SIZES[$DIR]}x${SIZES[$DIR]}" "$RES_DIR/$DIR/ic_launcher.png"
            convert -background none icon.svg -resize "${SIZES[$DIR]}x${SIZES[$DIR]}" "$RES_DIR/$DIR/ic_launcher_round.png"
          done
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      # Release signing: the keystore must be supplied by Jeramy as GitHub
      # Actions secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). No passwords are stored in
      # this repo. A fresh keystore must NOT be generated here: Play Store
      # updates require the same signing key every time.
      - name: Sign release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > autohustle-release.keystore
          $(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)apksigner sign \
            --ks autohustle-release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out AutoHustle-v10.apk android/app/build/outputs/apk/debug/app-debug.apk
          rm -f autohustle-release.keystore
      # Always hand back an APK: the signed v10 build when secrets are set,
      # otherwise the unsigned debug build (installable for testing, not for
      # the Play Store). Previously the upload step expected only the signed
      # file, so a run without secrets failed at upload instead of returning
      # the debug APK.
      - name: Prepare APK artifact
        run: |
          if [ -f AutoHustle-v10.apk ]; then
            echo "Signed APK ready: AutoHustle-v10.apk"
          else
            cp android/app/build/outputs/apk/debug/app-debug.apk AutoHustle-v10-debug.apk
            echo "No signing secrets set; handing back debug APK: AutoHustle-v10-debug.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AutoHustle-v10-APK
          path: |
            AutoHustle-v10.apk
            AutoHustle-v10-debug.apk
          if-no-files-found: error
