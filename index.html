<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoHustle | Mobile Mechanic for Gig Drivers</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="#" class="logo"><span>AUTOHUSTLE</span></a>
            <ul class="nav-links">
                <li><a href="#services">Services</a></li>
                <li><a href="#pricing">Pit Crew Pass</a></li>
                <li><a href="#contact" class="btn-nav">Book Now</a></li>
            </ul>
        </div>
    </nav>

    <header class="hero">
        <div class="container hero-content">
            <h1>Pit Stops for the Gig Economy.</h1>
            <p>Don't lose a day of pay. We bring the mechanic to you.</p>
            <a href="#contact" class="btn-primary">Get Back on the Road</a>
        </div>
    </header>

    <section id="services" class="features section-padding">
        <div class="container">
            <h2 class="section-title">Our Menu</h2>
            <div id="services-grid" class="feature-grid">
                <p>Loading service menu...</p>
            </div>
        </div>
    </section>

    <section id="pricing" class="pricing section-padding bg-dark">
        <div class="container">
            <h2 class="section-title text-light" id="sub-name">Loading...</h2>
            <div class="pricing-card">
                <div class="price-header">
                    <h3>Monthly</h3>
                    <div class="price">
                        $<span id="sub-price">--.--</span>
                    </div>
                </div>
                <ul class="price-features" id="sub-features">
                    </ul>
                <a href="#" class="btn-primary btn-block">Join the Crew</a>
            </div>
        </div>
    </section>

    <footer id="contact" class="footer">
        <div class="container">
            <p>&copy; 2024 AutoHustle LLC. Built for drivers, by drivers.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
